id = "my-mod"
name = "My Mod"
version = "0.1.0"
kzmSpec = 1

[lua]
sourceEntry = "lua/main.lua"
distEntry = "dist/entry.lua"
priority = 100

[lua.hooks]
scripts = []
objects = []

[patches]
mode = "none"

[native]
plugins = ["dist/my-mod.dll"]

[i18n]
defaultLocale = "en"
fallbackLocale = "en"

[i18n.ui]
en = "i18n/en.json"
ru = "i18n/ru.json"

[i18n.dialogues]
en = "i18n/dialogues/en.kzd"
ru = "i18n/dialogues/ru.kzd"

